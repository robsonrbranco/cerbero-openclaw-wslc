apiVersion: v1
kind: Namespace
metadata:
  name: olympus

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cerbero-config
  namespace: olympus
data:
  TERM: "xterm-256color"
  OPENCLAW_HOME: "/home/cerbero"
  OPENCLAW_STATE_DIR: "/home/cerbero/.openclaw"
  OPENCLAW_CONFIG_PATH: "/home/cerbero/.openclaw/openclaw.json"
  OPENCLAW_CONFIG_DIR: "/home/cerbero/.openclaw"
  OPENCLAW_WORKSPACE_DIR: "/home/cerbero/.openclaw/workspace"
  GOG_HOME: "/home/cerbero/.openclaw/state/gogcli"
  GOG_KEYRING_BACKEND: "file"
  # Sessao/chaves e indice SQLite do wacli ficam no PVC, nunca na imagem.
  # Um store por numero, cada um com seu lock e seu sidecar de sync:
  #   WACLI_STORE_DIR          -> numero do Branco (sidecar wacli-sync-branco).
  #                               O nome da VARIAVEL fica: wacli-sampaio e
  #                               wacli-base leem por ela. A pasta era
  #                               state/wacli ate 29/09/2026 e foi renomeada
  #                               para o padrao wacli-<dono>; ficou um link
  #                               simbolico state/wacli -> wacli-branco
  #                               durante a transicao.
  #   WACLI_STORE_DIR_CERBERO  -> numero dedicado do Cerbero, +55 21 97102-2207
  #                               (sidecar wacli-sync-cerbero, 29/09/2026).
  WACLI_STORE_DIR: "/home/cerbero/.openclaw/state/wacli-branco"
  WACLI_STORE_DIR_CERBERO: "/home/cerbero/.openclaw/state/wacli-cerbero"
  PATH: "/home/cerbero/.openclaw/extensions:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  # O openclaw.json migrado foi escrito pela versao 2026.7.1, mas a imagem
  # ghcr.io/openclaw/openclaw:latest publicada ainda esta na 2026.6.34 (mesmo
  # desalinhamento que afeta o plugin do WhatsApp, ver Dockerfile). Sem essa
  # flag o gateway recusa subir ("Refusing to run automatic gateway startup
  # migrations"). E o proprio escape-hatch documentado pelo OpenClaw pra
  # recuperacao/migracao intencional -- nao estamos fazendo downgrade de
  # dado nenhum, so rodando um binario temporariamente mais velho que o
  # config ate a imagem publicada alcancar essa versao.
  OPENCLAW_ALLOW_OLDER_BINARY_DESTRUCTIVE_ACTIONS: "1"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cerbero-data
  namespace: olympus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cerbero-secrets
  namespace: olympus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 100Mi

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cerbero-projects
  namespace: olympus
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerbero
  namespace: olympus
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cerbero
  template:
    metadata:
      labels:
        app: cerbero
    spec:
      initContainers:
        - name: sync-projects
          image: alpine/git:latest
          envFrom:
            - secretRef:
                name: cerbero-git-token
          command:
            - sh
            - -c
            - |
              set -e
              cd /projects
              for repo in cerbero-openclaw-wslc hermes-n8n-wslc argos-scraper-wslc; do
                dir=$(echo "$repo" | sed 's/-wslc$//' | sed 's/-openclaw//; s/-n8n//; s/-scraper//')
                url="https://x-access-token:${GIT_TOKEN}@github.com/robsonrbranco/${repo}.git"
                if [ -d "$dir/.git" ]; then
                  echo "Atualizando $dir..."
                  git -C "$dir" pull --ff-only || echo "pull falhou pra $dir, seguindo"
                else
                  echo "Clonando $repo em $dir..."
                  git clone "$url" "$dir" || echo "clone falhou pra $dir, seguindo"
                fi
              done
          volumeMounts:
            - name: projects
              mountPath: /projects
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: cerbero
          image: ghcr.io/robsonrbranco/cerbero-gateway:latest
          ports:
            - containerPort: 18789
          envFrom:
            - configMapRef:
                name: cerbero-config
            - secretRef:
                name: cerbero-env
          env:
            # Reaproveita o PAT ja usado pro clone dos repos privados no
            # initContainer sync-projects (secret cerbero-git-token) como
            # GH_TOKEN, pra habilitar o recurso de GitHub da Control UI
            # (hover cards + descoberta de projeto -- so acessa dados
            # publicos mesmo com um token de escopo mais amplo).
            - name: GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cerbero-git-token
                  key: GIT_TOKEN
          volumeMounts:
            - name: data
              mountPath: /home/cerbero/.openclaw
            - name: secrets
              mountPath: /home/cerbero/.config/openclaw
            - name: projects
              mountPath: /home/cerbero/projects
            - name: hermes-data
              mountPath: /home/cerbero/data/hermes
            - name: argos-certs
              mountPath: /home/cerbero/data/argos/certs
              readOnly: true
            - name: argos-env
              mountPath: /home/cerbero/data/argos/env
              readOnly: true
            - name: weathernext-credentials
              mountPath: /home/cerbero/.gcp
              readOnly: true
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            # 3Gi desde 30/09/2026 (era 2Gi): na 2026.9.6 o historico fica
            # comprimido e reler a sessao principal custa mais memoria. Uma
            # consolidacao de timesheet interrompida era retomada a cada
            # subida (main-session-restart-recovery), passava de 1,9 GB em
            # ~2,5 min e o container morria por OOM -- ciclo sem fim. Com 3Gi
            # a retomada terminou (pico 1,34 GB) e o uso assentou em ~1 GB.
            # Ver LICOES-APRENDIDAS.md item 54.
            # 4Gi desde 06/10/2026 (era 3Gi), antes da troca para a 2026.9.8:
            # o container ja roda a ~2,7 Gi e teve 1 OOM, e o changelog da 9.7
            # traz migracoes de banco na subida que chegaram a dobrar o uso no
            # Calimaco (pico 2,0 Gi, assentou 1,4 Gi). E so teto: o request
            # continua 512Mi.
            limits:
              cpu: 1000m
              memory: 4Gi
        # Um sidecar de sync por numero, no MESMO formato (29/09/2026): o
        # `wacli sync --follow` cuida de um store so, e cada store tem o seu
        # lock -- dois numeros sao dois processos. Container proprio para
        # cada um porque cai e volta sozinho e tem log separado
        # (`logs -c wacli-sync-branco` / `-c wacli-sync-cerbero`).
        #
        # Os dois esperam o pareamento em vez de falhar: sem session.db o
        # laco dorme e tenta de novo, e nada derruba o container principal.
        #
        # --presence-mode quiet: em `normal`, o padrao, a sincronizacao
        #   EMITE PRESENCA -- os contatos veem o numero "online" sem ninguem
        #   ali. Espelho nao deve aparecer do outro lado.
        # --max-db-size: ao chegar no teto o sync PARA (nao apaga nada). E o
        #   que impede o espelho de encher o disco do node sem aviso. O teto
        #   e por volume: o do Branco tinha 267 MB em 29/09 (~5 MB/dia desde
        #   agosto), por isso 2GB; o do Cerbero comeca vazio, 500MB. Quando
        #   um parar, `wacli doctor` mostra, e o conserto e subir o teto.
        - name: wacli-sync-branco
          image: ghcr.io/robsonrbranco/cerbero-gateway:latest
          envFrom:
            - configMapRef:
                name: cerbero-config
          command:
            - sh
            - -c
            - |
              set -u
              while true; do
                if [ ! -f "${WACLI_STORE_DIR}/session.db" ]; then
                  echo "wacli (numero do Branco) ainda nao pareado; aguardando session.db..."
                  sleep 60
                  continue
                fi
                wacli --store "${WACLI_STORE_DIR}" sync --follow --max-db-size 2GB --presence-mode quiet || true
                sleep 60
              done
          volumeMounts:
            - name: data
              mountPath: /home/cerbero/.openclaw
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        - name: wacli-sync-cerbero
          image: ghcr.io/robsonrbranco/cerbero-gateway:latest
          envFrom:
            - configMapRef:
                name: cerbero-config
          command:
            - sh
            - -c
            - |
              set -u
              while true; do
                if [ ! -f "${WACLI_STORE_DIR_CERBERO}/session.db" ]; then
                  echo "wacli (numero do Cerbero) ainda nao pareado; aguardando session.db..."
                  sleep 60
                  continue
                fi
                wacli --store "${WACLI_STORE_DIR_CERBERO}" sync --follow --max-db-size 500MB --presence-mode quiet || true
                sleep 60
              done
          volumeMounts:
            - name: data
              mountPath: /home/cerbero/.openclaw
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
        # Node-host local: o Gateway pareado consigo mesmo como "node" (mesma
        # identidade do device "cli" existente, so com role node adicionada
        # via `openclaw devices approve`, feito manualmente uma vez em
        # 09/09/2026 - nao repetir esse pareamento, ele ja persiste no volume
        # "data" abaixo). Sem isso, o OpenClaw nao anuncia CLI nativa (Claude
        # Code) como disponivel no dashboard, mesmo com o binario instalado e
        # nodeHost.agentRuns.claude.enabled=true - "native CLI" e um conceito
        # de NODE, nao do processo do Gateway em si (ver LICOES-APRENDIDAS.md
        # item 37/38). Este sidecar so mantem essa conexao viva; nao guarda
        # estado proprio (a identidade pareada vive no volume compartilhado).
        # Memoria generosa de proposito: "openclaw node run" carrega o mesmo
        # runtime Node.js pesado do gateway principal (nao e um binario leve
        # tipo o wacli acima) - 256Mi (copiado do wacli-sync por engano)
        # OOMKilled na primeira tentativa em producao (09/09/2026).
        # secretRef cerbero-env (ANTHROPIC_API_KEY) adicionado em 14/09/2026:
        # sem isso o "claude" CLI que esse container executa fica sem
        # credencial propria - dashboard mostrava "Claude CLI is not
        # authenticated on this host" mesmo com o binario logado via API key
        # no container "cerbero" principal (variavel de ambiente nao e
        # compartilhada entre containers do mesmo pod). Ver item 44 do
        # LICOES-APRENDIDAS.md.
        - name: node-host
          image: ghcr.io/robsonrbranco/cerbero-gateway:latest
          envFrom:
            - configMapRef:
                name: cerbero-config
            - secretRef:
                name: cerbero-env
          command:
            - sh
            - -c
            - |
              set -u
              while true; do
                openclaw node run --host 127.0.0.1 --port 18789 --no-tls || true
                sleep 10
              done
          volumeMounts:
            - name: data
              mountPath: /home/cerbero/.openclaw
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 768Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: cerbero-data
        - name: secrets
          persistentVolumeClaim:
            claimName: cerbero-secrets
        - name: projects
          persistentVolumeClaim:
            claimName: cerbero-projects
        - name: hermes-data
          persistentVolumeClaim:
            claimName: hermes-data
        - name: argos-certs
          secret:
            secretName: argos-certs
        - name: argos-env
          secret:
            secretName: argos-env
        - name: weathernext-credentials
          secret:
            secretName: weathernext-credentials

---
apiVersion: v1
kind: Service
metadata:
  name: cerbero
  namespace: olympus
spec:
  selector:
    app: cerbero
  ports:
    - port: 18789
      targetPort: 18789

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cerbero
  namespace: olympus
spec:
  rules:
    - host: cerbero.ecomciencia.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: cerbero
                port:
                  number: 18789
